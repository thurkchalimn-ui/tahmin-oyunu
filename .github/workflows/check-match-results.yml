name: Bildirim, Hatırlatma ve Canlı Skor Kontrolü

# ÖNEMLİ: "schedule" (GitHub'ın kendi zamanlayıcısı) burada bilinçli olarak YOK.
# Script artık TEK bir çalışmada, kendi içinde ~5 saat 45 dakika boyunca 5
# dakikada bir tekrar eden bir döngü olarak çalışıyor (bkz. check-results.js).
# Bu yüzden cron-job.org'un artık her 5 dakikada değil, her ~5.5-6 saatte bir
# tetiklemesi yeterli - hem GitHub'ın "yeni çalışma başlatma" yükünü hem de
# runner bekleme gecikmesine maruz kalma sıklığını ciddi şekilde azaltıyor.
on:
  workflow_dispatch:

jobs:
  check-results:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # ~5 saat 55 dakika - script'in kendi 5s45d limitine + pay
    defaults:
      run:
        working-directory: automation
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları kur
        run: npm install

      - name: Bildirim/hatırlatma/canlı skor scriptini çalıştır (sürekli döngü)
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: npm run check-results
